<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Hunt KH</title>

    <!-- CSS -->
    <link rel="stylesheet" href="footer.css">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    
    <footer class="footer">


        <div class="footer-container">


            <div class="footer-brand">

                <img src="/Page/logo-white.png" alt="Home Hunt KH Logo" class="logo">

                <p class="slogan">
                    Safe rooms, real photos,<br>
                    clear prices
                </p>

            </div>


            <div class="footer-contact">

                <div class="footer-item">
                    <p class="title">Phone Number:</p>
                    <p>012345678</p>
                </div>

                <div class="footer-item">
                    <p class="title">Email:</p>
                    <p>hello@homehuntkh.example</p>
                </div>

                <div class="footer-item">
                    <p class="title">Address:</p>
                    <p>Street 315, Boeung Kak 2, Toul Kork, Phnom Penh</p>
                </div>

            </div>


            <div class="footer-schedule">

                <div class="footer-item">
                    <p class="title">Date:</p>
                    <p>Monday to<br>Saturday</p>
                </div>

                <div class="footer-item">
                    <p class="title">Time:</p>
                    <p>8:00 to 18:00</p>
                </div>

            </div>

        </div>


        <div class="footer-divider"></div>


        <div class="footer-social">

            <a href="mailto:hello@homehuntkh.example" aria-label="Email">
                <i class="fa-solid fa-envelope"></i>
            </a>

            <a href="#" aria-label="Instagram">
                <i class="fa-brands fa-instagram"></i>
            </a>

            <a href="#" aria-label="Telegram">
                <i class="fa-brands fa-telegram"></i>
            </a>

            <a href="#" aria-label="Facebook">
                <i class="fa-brands fa-facebook-f"></i>
            </a>

            <a href="tel:012345678" aria-label="Phone">
                <i class="fa-solid fa-phone"></i>
            </a>

        </div>

    </footer>
    
</body>
</html>
